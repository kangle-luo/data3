  .lk{fill:none;}
  .lk .vis{

  }
  .lk.dim .vis{stroke-opacity:.11;}
  .lk.dim .lk-dot{opacity:.08;}
  .lk.on .vis{stroke-width:3.2;stroke-opacity:1;filter:drop-shadow(0 2px 6px rgba(40,60,90,.28));}
  .lk .hit{stroke:transparent;stroke-width:22;cursor:pointer;fill:none;pointer-events:stroke;}
  .lk-dot{transition:opacity .28s,r .28s;}
  .flow{filter:drop-shadow(0 1px 2px rgba(30,50,80,.28));}

  .nd{cursor:pointer;}
  .nd .halo{opacity:0;transition:opacity .32s;transform-box:fill-box;transform-origin:center;}

  .nd:hover .halo,.nd.on .halo{opacity:1;}

  .nd-case{font-size:10.5px;fill:#8c9aab;letter-spacing:.01em;pointer-events:none;}

        detail:'平台既未在开通时告知期满自动扣费，也未在扣费前作任何提示，法院将此种沉默认定为故意隐瞒，直接适用惩罚性赔偿。' },
      { p:'edu', tone:'amber', tag:'责令改正', short:'违规',
        finding:'未按「5 日提醒」环节拆分说理，整体认定违规。',
        result:'责令改正并处罚款',
        detail:'行政处罚决定未按三个环节逐项拆分说理，而是整体认定平台违反《电子商务法》第十九条及《网络交易监督管理办法》第十七条。' }
    ]},
  { key:'cancel', no:'03', name:'便捷取消', short:'便捷取消',
    law:'服务期内，简便取消、不收不合理费用',
    band1:'#d1c7e7', band2:'#b5a7d6', txt:'#5c4b86',
    tone:'gray',
    items:[
      { p:'video', tone:'gray', tag:'未单独认定', short:'未评价',
        finding:'判决未评价取消入口便利性，理由落在知情权与自主选择权受损。',
        result:'赔偿资金占用利息损失',
        detail:'所附材料对该案的论述集中于提醒方式，未就退订入口是否简便作出评价；裁判落点为知情权、自主选择权未获充分保障。' },
      { p:'cloud', tone:'gray', tag:'未单独认定', short:'未评价',
        finding:'争点集中于默认勾选与提醒显著性，退订通道便利性未展开。',
        result:'退款 + 二审调解另获补偿',
        detail:'案件争点集中在「默认勾选构成搭售」与「站内信不属显著方式」，退订入口问题未见独立认定。' },
      { p:'amazon', tone:'gray', tag:'未单独认定', short:'未评价',
        finding:'案件以欺诈定性收束，未涉及服务期内取消通道的认定。',
        result:'三倍赔偿（消保法 55 条）',
        detail:'该案以欺诈定性收束，未就服务期内取消通道是否便捷展开论述。' },
      { p:'edu', tone:'gray', tag:'未单独认定', short:'未评价',
        finding:'处罚决定整体认定违规，未按取消环节拆分认定。',
        result:'责令改正并罚款',
        detail:'处罚决定整体认定违规，未逐项区分开通、提醒、取消三个环节。' }
    ]}
];

/* ==================== 几何参数 ==================== */
const CX = 450, CY = 326;
const R_OUT = 160, R_IN = 100;     // 环带
const R_ANCH = 167;                // 接线端子半径（环外缘之外）
const R_NODE = 312, R_LABEL = 238; // 案件节点 / 标签
const NODE_R = 29;
const D2R = Math.PI / 180;

const SEG = [
  { i:0, a1:-170, a2:-50 },
  { i:1, a1:-50,  a2:70  },
  { i:2, a1:70,  a2:190 }
];
const NODE_ANG = { video:-135, cloud:-45, amazon:45, edu:135 };

const pt = (a, r) => [CX + r * Math.cos(a * D2R), CY + r * Math.sin(a * D2R)];
const f = n => Math.round(n * 100) / 100;
const P = (a, r) => { const p = pt(a, r); return f(p[0]) + ' ' + f(p[1]); };

/* 每段内部 4 个锚点：恒定按 platforms 顺序排列
   —— 这是「连得对」的关键：扇区内第 k 个槽位永远属于 platforms[k] */
function anchorAngles(a1, a2){
  const s = a1 + 9, e = a2 - 9, w = (e - s) / 4;
  return platforms.map((_, k) => s + w * (k + 0.5));
}
const ANCH = SEG.map(s => anchorAngles(s.a1, s.a2));

/* 明暗 */
const toneSolid = t => t === 'red' ? '#b3564a' : t === 'amber' ? '#a8742f' : '#aab6c7';

/* ==================== 组装连接（程序遍历，不手写） ==================== */
const links = [];
platforms.forEach(p => {
  layers.forEach((L, li) => {
    const it = L.items.find(x => x.p === p.id);
    const slot = platforms.findIndex(x => x.id === p.id);
    links.push({
      id: p.id + '-' + L.key,
      p, L, it, li, slot,
      a0: NODE_ANG[p.id],
      a1: ANCH[li][slot],
      color: toneSolid(it.tone)
    });
  });
});

/* ==================== SVG 构建 ==================== */
const svg = document.getElementById('chart');
const NS = 'http://www.w3.org/2000/svg';
const mk = (t, attrs, html) => {
  const e = document.createElementNS(NS, t);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (html != null) e.innerHTML = html;
  return e;
};
const gSegs  = mk('g', {});
const gLines = mk('g', {});
const gHits  = mk('g', {});
const gAnch  = mk('g', {});
const gNodes = mk('g', {});
const gCtr   = mk('g', {});
const gTags  = mk('g', {});

/* --- defs --- */
const defs = mk('defs', {});
defs.innerHTML = `
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#2a3f5c" flood-opacity="0.13"/>
  </filter>
  <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%">
    <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#2a3f5c" flood-opacity="0.16"/>
  </filter>
  <radialGradient id="ctrFill" cx="50%" cy="42%" r="62%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#f7fafd"/>
  </radialGradient>
  <radialGradient id="ctrRing" cx="50%" cy="50%" r="50%">
    <stop offset="86%" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="100%" stop-color="#cfdaea" stop-opacity=".55"/>
  </radialGradient>`;
svg.appendChild(defs);

/* --- 环形分段 --- */
function donut(a1, a2, r1, r2){
  const laf = (a2 - a1) > 180 ? 1 : 0;
  return `M${P(a1, r2)} A${r2} ${r2} 0 ${laf} 1 ${P(a2, r2)}
          L${P(a2, r1)} A${r1} ${r1} 0 ${laf} 0 ${P(a1, r1)} Z`;
}

SEG.forEach((s, i) => {
  const L = layers[i];
  const g = mk('g', { class:'seg', 'data-seg':i });
  const a1 = s.a1 + 1.4, a2 = s.a2 - 1.4;

  // 主带（渐变）
  const gid = 'bg' + i;
  defs.innerHTML += `<linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="${L.band1}"/><stop offset="100%" stop-color="${L.band2}"/></linearGradient>`;
  g.appendChild(mk('path', { class:'band', d: donut(a1, a2, R_IN, R_OUT),
    fill:`url(#${gid})`, filter:'url(#soft)' }));

  // 环带外描边（细白）
  g.appendChild(mk('path', { d: donut(a1, a2, R_IN, R_OUT), fill:'none',
    stroke:'rgba(255,255,255,.85)', 'stroke-width':1.6 }));

  // 沿弧文字
  const mid = (a1 + a2) / 2;
  const rev = mid > 90 && mid < 270;
  const pa = rev ? a2 : a1, pb = rev ? a1 : a2;
  const pr = (R_IN + R_OUT) / 2 + 1;
  const tpId = 'tp' + i;
  defs.appendChild(mk('path', {
    id: tpId, fill:'none',
    d:`M${P(pa, pr)} A${pr} ${pr} 0 0 ${rev ? 0 : 1} ${P(pb, pr)}`
  }));
  const t = mk('text', { class:'seg-txt', 'text-anchor':'middle',
    'dominant-baseline':'middle', fill:L.txt });
  const tp = mk('textPath', { href:'#' + tpId, startOffset:'50%' });
  tp.textContent = L.no + '　' + L.name;
  t.appendChild(tp);
  g.appendChild(t);

  gSegs.appendChild(g);
});

/* --- 中心圆 --- */
gCtr.appendChild(mk('circle', { cx:CX, cy:CY, r:R_IN - 13, fill:'url(#ctrFill)',
  stroke:'#e8eef6', 'stroke-width':1, filter:'url(#soft2)' }));
gCtr.appendChild(mk('circle', { cx:CX, cy:CY, r:R_IN - 13, fill:'url(#ctrRing)' }));

const cBig = mk('text', { class:'c-big', x:CX, y:CY - 14, 'text-anchor':'middle' });
const cMid = mk('text', { class:'c-mid', x:CX, y:CY + 20, 'text-anchor':'middle' });
const cSm  = mk('text', { class:'c-sm',  x:CX, y:CY + 42, 'text-anchor':'middle' });
gCtr.append(cBig, cMid, cSm);

function setCenter(big, mid, sm, bigColor, bigSize){
  const sz = bigSize || 44;
  cBig.textContent = big;
  cBig.style.fontSize = sz + 'px';
  cBig.setAttribute('fill', bigColor || '#22303f');
  cBig.setAttribute('y', CY - 14 + (44 - sz) * 0.16);
  cMid.textContent = mid || '';
  cSm.textContent  = sm || '';
  const dy = sz < 40 ? 6 : 0;
  cMid.setAttribute('y', CY + 20 + dy);
  cSm.setAttribute('y', CY + 42 + dy);
}

/* --- 连线 --- */
const linkEls = {};
links.forEach(k => {
  const d = linkD(k.a0, k.a1);

  // 起点 = 案件色，终点 = 结论色：一眼看出「谁 → 什么结果」
  const gp = 'lg-' + k.id;
  const s0 = pt(k.a0, R_NODE - NODE_R);
  const s1 = pt(k.a1, R_ANCH);
  defs.innerHTML += `<linearGradient id="${gp}" gradientUnits="userSpaceOnUse"
      x1="${f(s0[0])}" y1="${f(s0[1])}" x2="${f(s1[0])}" y2="${f(s1[1])}">
      <stop offset="0%" stop-color="${k.p.fg}"/>
      <stop offset="46%" stop-color="${k.p.fg}" stop-opacity=".82"/>
      <stop offset="100%" stop-color="${k.color}"/>
    </linearGradient>`;

  const g = mk('g', { class:'lk', 'data-id':k.id, stroke:`url(#${gp})` });
  const vis = mk('path', { class:'vis', d, stroke:`url(#${gp})` });
  const hit = mk('path', { class:'hit', d });
  g.append(vis, hit);

  // 两端小圆点（案件色）
  const p0 = pt(k.a0, R_NODE - NODE_R - 2);
  const p3 = pt(k.a1, R_ANCH);
  const c0 = mk('circle', { class:'lk-dot', cx:f(p0[0]), cy:f(p0[1]), r:3.2,
    fill:k.p.fg, stroke:'#fff', 'stroke-width':1.4 });
  const c3 = mk('circle', { class:'lk-dot', cx:f(p3[0]), cy:f(p3[1]), r:2.4,
    fill:k.p.fg, stroke:'#fff', 'stroke-width':1 });
  g.append(c0, c3);

  gLines.appendChild(g);
  linkEls[k.id] = g;
});

function linkD(a0, a1){
  let d = a1 - a0;
  while (d > 180) d -= 360;
  while (d < -180) d += 360;
  const r0 = R_NODE - NODE_R + 2;
  const r1 = R_ANCH;

  const p0 = pt(a0, r0), p3 = pt(a1, r1);
  // 先沿圆周方向展开，再收进环：弧线贴外圈走，不与环内文字打架
  const c1 = pt(a0 + d * 0.12, 288);
  const c2 = pt(a1 - d * 0.17, 236);
  return `M${f(p0[0])} ${f(p0[1])} C${f(c1[0])} ${f(c1[1])}, ${f(c2[0])} ${f(c2[1])}, ${f(p3[0])} ${f(p3[1])}`;
}

/* --- 扇区接线端子（结论色，与线终点连续） --- */
SEG.forEach((s, i) => {
  const la = layers[i];
  platforms.forEach((p, k) => {
    const a = ANCH[i][k];
    const item = la.items.find(x => x.p === p.id);
    const c = mk('circle', { cx:f(pt(a, R_ANCH)[0]), cy:f(pt(a, R_ANCH)[1]), r:5.4,
      fill:toneSolid(item.tone), stroke:'#fff', 'stroke-width':1.8, class:'term',
      'data-term':p.id + '-' + la.key });
    gAnch.appendChild(c);
  });
});

/* --- 案件节点 --- */
const nodeEls = {};
platforms.forEach(p => {
  const a = NODE_ANG[p.id];
  const [x, y] = pt(a, R_NODE);
  const g = mk('g', { class:'nd', 'data-node':p.id,
    transform:`translate(${f(x)},${f(y)})` });

  g.appendChild(mk('circle', { class:'halo', r:NODE_R + 12, fill:'none',
    stroke:p.fg, 'stroke-opacity':.22, 'stroke-width':9 }));
  g.appendChild(mk('circle', { class:'disc', r:NODE_R, fill:'#fff',
    stroke:'#fff', 'stroke-width':3, filter:'url(#soft)' }));
  g.appendChild(mk('circle', { r:NODE_R - 3.4, fill:p.soft }));
  const ic = mk('g', { transform:'translate(-13,-13) scale(1.083)',
    stroke:p.fg, fill:'none', 'stroke-width':1.75,
    'stroke-linecap':'round', 'stroke-linejoin':'round' });
  ic.innerHTML = p.ico;
  g.appendChild(ic);
  gNodes.appendChild(g);
  nodeEls[p.id] = g;

  /* 标签：放在节点与环之间 */
  const [lx, ly] = pt(a, R_LABEL);
  const lb = mk('text', { x:f(lx), y:f(ly), 'text-anchor':'middle',
    'paint-order':'stroke', stroke:'#f4f7fb', 'stroke-width':4.5,
    'stroke-linejoin':'round' });
  const n1 = mk('tspan', { class:'nd-name', x:f(lx), dy:0 });
  n1.textContent = p.name;
  const n2 = mk('tspan', { class:'nd-case', x:f(lx), dy:17 });
  n2.textContent = p.caseName;
  lb.append(n1, n2);
  gNodes.appendChild(lb);
});

/* --- 线上小标签容器 --- */
gTags.setAttribute('pointer-events', 'none');

svg.append(gHits, gLines, gSegs, gAnch, gNodes, gCtr, gTags);

/* ==================== 交互 ==================== */
const tip = document.getElementById('tip');
const tipK = document.getElementById('tipK');
const tipT = document.getElementById('tipT');
const tipD = document.getElementById('tipD');

let hoverLink = null;

/* 流动光点：从案件流向环上对应端子，方向一目了然 */
function addFlow(ids){
  clearFlow();
  ids.forEach(id => {
    const g = linkEls[id];
    const vis = g.querySelector('.vis');
    const k = links.find(x => x.id === id);
    const c = mk('circle', { r:3.1, fill:'#fff', stroke:k.color,
      'stroke-width':1.6, class:'flow', 'pointer-events':'none' });
    const am = mk('animateMotion', {
      dur:'1.7s', repeatCount:'indefinite', path: vis.getAttribute('d'), rotate:'auto' });
    c.appendChild(am);
    g.appendChild(c);
  });
}
function clearFlow(){
  document.querySelectorAll('.flow').forEach(e => e.remove());
}

function clearAll(){
  Object.values(linkEls).forEach(g => g.classList.remove('dim', 'on'));
  nodeEls && Object.values(nodeEls).forEach(g => g.classList.remove('on'));
  document.querySelectorAll('.seg').forEach(g => g.classList.remove('on'));
  document.querySelectorAll('.tl').forEach(t => t.classList.remove('show'));
  clearFlow();
  setCenter('4/4', '续费前提醒全部被判违法', '0/4 取消入口获独立审查', '#22303f', 44);
}

clearAll();

/* 悬停一条线 */
links.forEach(k => {
  const g = linkEls[k.id];
  const hit = g.querySelector('.hit');

  hit.addEventListener('mouseenter', e => {
    hoverLink = k.id;
    Object.entries(linkEls).forEach(([id, el]) => {
      el.classList.toggle('dim', id !== k.id);
      el.classList.toggle('on', id === k.id);
    });
    nodeEls[k.p.id].classList.add('on');
    addFlow([k.id]);
    document.querySelectorAll('.seg').forEach(sg =>
      sg.classList.toggle('on', +sg.dataset.seg === k.li));
    setCenter(k.it.short, k.p.name + ' · ' + k.L.name, '点击查看认定原文',
      toneSolid(k.it.tone), 26);

    tipK.textContent = k.p.name + '　' + k.L.no + ' ' + k.L.name;
    tipT.textContent = k.it.tag;
    tipD.textContent = k.it.finding;
    tip.classList.add('show');
  });

  hit.addEventListener('mousemove', e => {
    const w = tip.offsetWidth, h = tip.offsetHeight;
    let x = e.clientX + 16, y = e.clientY + 16;
    if (x + w > innerWidth - 12) x = e.clientX - w - 16;
    if (y + h > innerHeight - 12) y = e.clientY - h - 16;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  });

  hit.addEventListener('mouseleave', () => {
    hoverLink = null;
    tip.classList.remove('show');
    clearAll();
  });

  hit.addEventListener('click', () => openSheet(k));
});

/* 悬停节点：只留该案三条线，其余淡化 */
platforms.forEach(p => {
  const g = nodeEls[p.id];
  g.addEventListener('mouseenter', () => {
    Object.entries(linkEls).forEach(([id, el]) => {
      const mine = id.startsWith(p.id + '-');
      el.classList.toggle('on', mine);
      el.classList.toggle('dim', !mine);
    });
    g.classList.add('on');
    setCenter('3', p.name + ' · 三个环节', '点击查看该案认定原文', '#22303f', 44);

    addFlow(links.filter(k => k.p.id === p.id).map(k => k.id));

    gTags.innerHTML = '';
    links.filter(k => k.p.id === p.id).forEach(k => {
      const el = linkEls[k.id].querySelector('.vis');
      const len = el.getTotalLength();
      const m = el.getPointAtLength(len * 0.5);
      const vx = m.x - CX, vy = m.y - CY;
      const vl = Math.hypot(vx, vy) || 1;
      const lx = m.x + vx / vl * 17, ly = m.y + vy / vl * 17;
      const label = k.it.short;
      const w = label.length * 11 + 18;
      const tg = mk('g', { class:'tl show', transform:`translate(${f(lx - w/2)},${f(ly - 10)})` });
      tg.appendChild(mk('rect', { x:0, y:0, width:w, height:20, rx:10, fill:'#fff',
        stroke:'rgba(60,90,130,.16)' }));
      const t = mk('text', { x:w/2, y:13.8, 'text-anchor':'middle', fill:'#3d5268' });
      t.textContent = label;
      tg.appendChild(t);
      gTags.appendChild(tg);
    });
  });
  g.addEventListener('mouseleave', () => {
    if (!hoverLink) clearAll();
  });
  g.addEventListener('click', () => openCaseSheet(p));
});

/* 悬停扇区：该环节四条线 */
document.querySelectorAll('.seg').forEach(sg => {
  const i = +sg.dataset.seg;
  sg.addEventListener('mouseenter', () => {
    Object.entries(linkEls).forEach(([id, el]) => {
      const mine = id.endsWith('-' + layers[i].key);
      el.classList.toggle('on', mine);
      el.classList.toggle('dim', !mine);
    });
    addFlow(links.filter(k => k.li === i).map(k => k.id));
    sg.classList.add('on');
    const L = layers[i];
    const bad = L.items.filter(x => x.tone !== 'gray').length;
    setCenter(bad + '/4', L.name + ' · 被判违规', L.law, '#22303f', 38);
  });
  sg.addEventListener('mouseleave', () => {
    if (!hoverLink) clearAll();
  });
});

/* ==================== 弹层 ==================== */
const mask = document.getElementById('mask');
const shKick = document.getElementById('shKick');
const shTitle = document.getElementById('shTitle');
const shSrc = document.getElementById('shSrc');
const shDims = document.getElementById('shDims');
const shFinding = document.getElementById('shFinding');
const shResult = document.getElementById('shResult');
const shLink = document.getElementById('shLink');
const shLinkText = document.getElementById('shLinkText');

function fillSheet(p, curLi){
  shKick.textContent = layers[curLi].no + '  ' + layers[curLi].name;
  shTitle.textContent = p.caseName;
  shSrc.textContent = p.court + '　·　责任类型：' + p.liability;

  shDims.innerHTML = layers.map((L, i) => {
    const d = L.items.find(x => x.p === p.id);
    return `<div class="sh-dim t-${d.tone}${i === curLi ? ' on' : ''}">
      <span>${L.name}</span><b>${d.tag}</b></div>`;
  }).join('');

  const it = layers[curLi].items.find(x => x.p === p.id);
  shFinding.textContent = it.detail;
  shResult.innerHTML = it.result;

  shLink.href = p.url;
  shLinkText.textContent = p.srcLabel;
}

function openSheet(k){
  fillSheet(k.p, k.li);
  mask.classList.add('on');
  tip.classList.remove('show');
}
function openCaseSheet(p){
  let idx = layers.findIndex(L => L.items.find(x => x.p === p.id).tone !== 'gray');
  if (idx < 0) idx = 0;
  fillSheet(p, idx);
  shKick.textContent = '案件总览　·　' + layers[idx].no + ' ' + layers[idx].name;
  mask.classList.add('on');
}
function closeSheet(){ mask.classList.remove('on'); }

document.getElementById('shClose').addEventListener('click', closeSheet);
mask.addEventListener('click', e => { if (e.target === mask) closeSheet(); });
addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSheet(); clearAll(); }
});

/* 移动端：初始滚动到图形中部 */
(function(){
  const st = document.getElementById('stage');
  const fit = () => { st.scrollLeft = (st.scrollWidth - st.clientWidth) / 2; };
  if (st.scrollWidth > st.clientWidth + 4) fit();
  addEventListener('resize', fit);
})();

/* 触摸端：点击空白收起 */
svg.addEventListener('click', e => {
  if (e.target === svg) { clearAll(); }
});
</script>
</body>
</html>
